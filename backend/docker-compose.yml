version: "3.9"

services:
  # -------------------- DATABASE --------------------
  postgres:
    image: postgres:15
    container_name: oracle-ai-postgresss
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: oracle_ai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- REDIS --------------------
  redis:
    image: redis:7-alpine
    container_name: oracle-ai-redisss
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------- BACKEND API --------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-ai-backenddd
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: oracle_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      MCP_URL: http://mcp-server:5001/mcp
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs

  # -------------------- WORKER --------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: oracle-ai-workerrr
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: oracle_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_URL: http://mcp-server:5001/mcp
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  # -------------------- MCP SERVER --------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: oracle-ai-mcp
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./mcp-server/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy

# -------------------- VOLUMES --------------------
volumes:
  pg_data:
  redis_data: