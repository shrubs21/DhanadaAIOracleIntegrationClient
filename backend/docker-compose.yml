version: "3.9"

services:

  # -------------------- DATABASE --------------------
  postgres:
    image: postgres:15
    container_name: oracle-ai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: oracle_ai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- REDIS --------------------
  redis:
    image: redis:7-alpine
    container_name: oracle-ai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------- BACKEND --------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-ai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: oracle_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_URL: http://mcp-server:5001/mcp
      NODE_ENV: production
    volumes:
      - ./logs:/app/logs

  # -------------------- WORKER --------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: oracle-ai-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
      n8n:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: oracle_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_URL: http://mcp-server:5001/mcp
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # ✅ Correct Docker service name
      N8N_INVOICE_WEBHOOK: http://n8n:5678/webhook/invoice-agent
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  # -------------------- MCP SERVER --------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: oracle-ai-mcp
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./mcp-server/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  # -------------------- N8N --------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: oracle-ai-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      # ✅ CRITICAL FIX — use Docker service name
      - WEBHOOK_URL=http://n8n:5678

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy

# -------------------- VOLUMES --------------------
volumes:
  pg_data:
  redis_data:
  n8n_data: